{% load i18n %}
{% get_current_language as LANGUAGE_CODE %}

<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE }}">
<head>
    <title>{% trans "Localization Project" %}</title>
</head>
<body>
    <h1>{{ greeting }}</h1>
    <p>{% trans "Number:" %} {{ large_number }}</p>
    <p>{% trans "Date:" %} {{ current_date }}</p>

    <form action="{% url 'set_language' %}" method="post">
        {% csrf_token %}
        <input name="next" type="hidden" value="{{ redirect_to }}" />
        <select name="language">
            <option value="en" {% if LANGUAGE_CODE == "en" %}selected{% endif %}>English</option>
            <option value="es" {% if LANGUAGE_CODE == "es" %}selected{% endif %}>Español</option>
            <option value="fr" {% if LANGUAGE_CODE == "fr" %}selected{% endif %}>Français</option>
        </select>
        <input type="submit" value="Change Language">
    </form>
</body>
</html>
